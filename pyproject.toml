# Lint settings of ESPHome, so that the component can move there unchanged
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "PL", "RET", "SIM", "UP", "W"]
ignore = ["E501", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["esphome"]
combine-as-imports = true
split-on-trailing-comma = false
