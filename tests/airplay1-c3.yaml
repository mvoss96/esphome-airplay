# AirPlay 1 only, with a password, on an ESP32-C3 (RISC-V, one core, no PSRAM)
substitutions:
  i2s_lrclk_pin: GPIO4
  i2s_bclk_pin: GPIO5
  i2s_dout_pin: GPIO6

esphome:
  name: airplay-test-c3

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

packages:
  common: !include common.yaml

airplay:
  id: airplay_hub
  name: ESPHome Speaker
  model: Test Speaker
  password: secret
  port: 5000

media_source:
  - platform: airplay
    id: airplay_source
    buffer_duration: 750ms
