# Shared by the test configurations: the receiver with every entity and action
external_components:
  - source:
      type: local
      path: ../components
    components: [airplay]

wifi:
  ap:

logger:

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: ${i2s_lrclk_pin}
    i2s_bclk_pin: ${i2s_bclk_pin}

speaker:
  - platform: i2s_audio
    id: airplay_speaker
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    sample_rate: 44100
    num_channels: 2

media_player:
  - platform: speaker_source
    id: airplay_media_player
    name: AirPlay Media Player
    media_pipeline:
      speaker: airplay_speaker
      sources:
        - airplay_source

text_sensor:
  - platform: airplay
    type: title
    name: AirPlay Title
  - platform: airplay
    type: artist
    name: AirPlay Artist
  - platform: airplay
    type: album
    name: AirPlay Album
  - platform: airplay
    type: album_artist
    name: AirPlay Album Artist

sensor:
  - platform: airplay
    type: track_progress
    name: AirPlay Track Progress
    update_interval: 500ms
  - platform: airplay
    type: track_duration
    name: AirPlay Track Duration
  - platform: airplay
    type: year
    name: AirPlay Year
  - platform: airplay
    type: track
    name: AirPlay Track

script:
  - id: airplay_remote_commands
    then:
      - airplay.play
      - airplay.pause: airplay_hub
      - airplay.next:
          id: airplay_hub
      - airplay.previous
